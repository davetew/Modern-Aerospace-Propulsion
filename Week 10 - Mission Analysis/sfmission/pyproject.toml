[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfmission"
version = "0.1.0"
description = "Patched-conic mission analysis for lunar and interplanetary mission design (MECE 4305 Week 10; preliminary design)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David E. Tew"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=7", "astropy>=5.3"]
dev = ["pytest>=7", "astropy>=5.3", "mcp>=1.2", "jupyter"]

[project.scripts]
sfmission = "sfmission.cli:main"
sfmission-mcp = "sfmission.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
